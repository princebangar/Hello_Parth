<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hello-parth-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hello Parth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Web fonts: ONE request for every family the screens use, loaded without blocking the first paint (the
         boot skeleton below must not wait on a third-party round trip; display=swap shows the text in a fallback
         font until the font arrives). The Taxi and Delivery stylesheets used to @import their own copy, which held
         their route chunk back until Google answered. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@500;600;700;800&family=Sora:wght@600;700&family=Caveat:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@500;600;700;800&family=Sora:wght@600;700&family=Caveat:wght@600;700&display=swap"></noscript>
    <script>
      (function() {
        try {
          // Only the Food/Taxi consumer app has a real dark mode toggle. Admin, login and the
          // driver/owner portals are light-only (no dark: styling anywhere in their markup) — this
          // must match isUserAppPath() in shared/utils/theme.js, or a saved consumer dark-mode
          // preference leaks into admin on a hard load/refresh, before React gets a chance to
          // correct it, leaving native form bits (text caret, hover I-beam cursor) rendered in
          // their dark-mode colour on an all-white admin page.
          var path = window.location.pathname || '';
          var isUserAppPath = path.indexOf('/food/') === 0 || path.indexOf('/taxi/user') === 0;
          var theme = 'light';
          if (isUserAppPath) {
            // 'userTheme' is the single current key (see shared/utils/theme.js);
            // the rest are only checked as a fallback for old saved values.
            var keys = ['userTheme', 'foodUserTheme', 'appTheme', 'userAppTheme'];
            for (var i = 0; i < keys.length; i++) {
              var v = localStorage.getItem(keys[i]);
              if (v) {
                theme = String(v).trim().toLowerCase() === 'dark' ? 'dark' : 'light';
                break;
              }
            }
          }
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;

          // Which placeholder to paint before the JS arrives: the home-shaped skeleton belongs to the consumer app
          // screens only (signed-in "/", Taxi and Food user); Terms / Privacy / Support get the plain loader (kept
          // in step with shared/utils/policyPaths.js); login, admin and the partner portals show nothing but the
          // page colour instead of a skeleton of a screen they will never show.
          var signedIn = !!(localStorage.getItem('userToken') || localStorage.getItem('user_accessToken'));
          var policy = /^\/(?:food\/user\/profile\/(?:terms|privacy|support-info|refund|shipping|cancellation)|food\/restaurant\/(?:terms|privacy|help-content|help-centre\/support)|food\/delivery\/(?:terms|privacy|profile\/terms|profile\/privacy|help\/content)|taxi\/(?:driver|owner)\/legal\/(?:terms|privacy|support)|taxi\/(?:terms|terms-and-conditions|privacy|privacy-policy|refund|cancellation))\/?$/.test(path);
          var partnerPortal = /^\/food\/(?:restaurant|delivery|admin)(?:\/|$)/.test(path);
          var consumerApp = (path === '/' && signedIn) || path.indexOf('/taxi/user') === 0 || (/^\/food(?:\/|$)/.test(path) && !partnerPortal);
          root.setAttribute('data-boot', policy ? 'policy' : consumerApp ? 'app' : 'plain');

          // The Taxi / Food home on a phone: which header to paint, and the saved location to put in it.
          var homePath = path.replace(/\/+$/, '');
          var vertical = '';
          if (consumerApp) {
            if (homePath === '/taxi/user' || (path === '/' && signedIn)) vertical = 'taxi';
            else if (homePath === '/food' || homePath === '/food/user' || homePath === '/food/user/home') vertical = 'food';
          }
          if (vertical) {
            root.setAttribute('data-vertical', vertical);
            if (vertical === 'taxi') {
              // The Taxi home has a Google map: open the connections to Google while the app's own files download.
              ['https://maps.googleapis.com', 'https://maps.gstatic.com'].forEach(function (origin) {
                var l = document.createElement('link');
                l.rel = 'preconnect';
                l.href = origin;
                l.crossOrigin = '';
                document.head.appendChild(l);
              });
            }
            var parse = function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
            var loc = parse('userLocation');
            var taxiLoc = parse('helloparth:lastLocation');
            var title = '', sub = '';
            var isNum = function (v) { return /^-?\d/.test(v); };
            if (loc && (loc.area || loc.address || loc.formattedAddress)) {
              var city = String(loc.city || '').toLowerCase(), state = String(loc.state || '').toLowerCase();
              var area = String(loc.area || loc.subLocality || loc.mainTitle || loc.neighborhood || '').trim();
              if (area && !isNum(area) && area.toLowerCase() !== city && area.toLowerCase() !== state) title = area;
              if (!title) {
                var parts = String(loc.address || loc.formattedAddress || '').split(',');
                for (var j = 0; j < parts.length; j++) {
                  var part = parts[j].trim(), low = part.toLowerCase();
                  if (part.length > 2 && low !== city && low !== state && !isNum(part) && low !== 'select location') { title = part; break; }
                }
              }
              if (!title) title = area || String(loc.city || '');
              sub = [loc.state, loc.pincode || loc.zipCode || loc.postalCode].filter(Boolean).join(', ');
            } else if (taxiLoc && (taxiLoc.address || taxiLoc.area)) {
              var chunks = String(taxiLoc.address || taxiLoc.area).split(',');
              title = String(taxiLoc.area || chunks[0] || '').trim();
              sub = [taxiLoc.state, taxiLoc.pincode].filter(Boolean).join(', ');
            }
            window.__bootLoc = { title: title || 'Select Location', sub: sub };
          }
        } catch(e) {}
      })();
    </script>
    <style>
      /* Match the app's own background before React mounts, so a hard
         reload shows a plain themed colour instead of a stark white flash. */
      html, body { background-color: #fffdf9; }
      /* the browser's default 8px body margin would show as a white frame around the full-width header until the
         app's own stylesheet arrives (it only arrives with the JavaScript in dev) */
      html, body { margin: 0; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0b0b0b; }

      /* Static placeholder — plain HTML/CSS shown the instant the document
         paints, before the JS bundle has even started parsing. Food and
         Taxi now both render the exact same AppShellSkeleton component
         (src/modules/Food/components/ui/loading-skeletons.jsx) once React
         mounts, so this copies just that component's top section (same
         gradient background, same header/hero/section shapes) — close
         enough that the hand-off from this static markup into the real,
         React-rendered one is invisible instead of a blank flash. Plain
         inline CSS, not Tailwind classes — in dev, Tailwind's CSS is
         injected by JS and isn't available yet at this point. React's
         createRoot(...).render() wipes #root's innerHTML the moment it
         mounts, so this needs no cleanup. */
      #boot-skeleton {
        min-height: 100vh;
        max-width: 1024px;
        margin: 0 auto;
        padding: 24px 20px;
        box-sizing: border-box;
        background: radial-gradient(circle at top left, #fff8ef, transparent 34%), linear-gradient(180deg, #fffdf9 0%, #fff8f1 100%);
      }
      html[data-theme="dark"] #boot-skeleton {
        background: linear-gradient(180deg, #0b0b0b 0%, #151515 100%);
      }
      .boot-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .boot-actions { display: flex; gap: 12px; }
      .boot-hero { border-radius: 28px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.7); padding: 16px; margin-top: 24px; box-sizing: border-box; }
      html[data-theme="dark"] .boot-hero { border-color: rgba(255,255,255,0.1); background: #141414; }
      .boot-chip-row { display: flex; gap: 12px; overflow: hidden; margin-top: 12px; }
      .boot-bar {
        background-color: rgba(226, 232, 240, 0.8);
        border-radius: 16px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      html[data-theme="dark"] .boot-bar { background-color: rgba(255, 255, 255, 0.1); }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      /* Only the consumer app screens get the skeleton; everything else stays on the plain page colour. */
      html[data-boot="plain"] #boot-skeleton,
      html[data-boot="policy"] #boot-skeleton { display: none; }

      /* Terms / Privacy / Support: the same loader the React screen shows (shared/components/PolicyPageLoader.jsx). */
      #boot-loader { display: none; }
      html[data-boot="policy"] #boot-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; background: #ffffff;
      }
      html[data-boot="policy"][data-theme="dark"] #boot-loader { background: #0a0a0a; }
      #boot-loader svg { animation: boot-spin 1s linear infinite; }
      #boot-loader p {
        margin: 16px 0 0; font: 700 10px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.1em; text-transform: uppercase; color: #6b7280;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }

      /* ---- Real top of the Taxi / Food home, painted from this file alone ------------------------------------
         On a phone the first thing on screen after a refresh is the actual header - the person's saved location,
         the Taxi | Food switch and the icons - in the app's own colours, instead of grey bars. Only the part below
         it is a skeleton. Keep in step with shared/components/SuperAppHomeHeader.jsx and with
         BootShellHeader in shared/components/BootShell.jsx (React shows the same header while the app loads). */
      .boot-shell { display: none; }
      .boot-only-food, .boot-only-taxi { display: none; }
      @media (max-width: 767px) {
        html[data-boot="app"][data-vertical] .boot-shell { display: block; }
        html[data-boot="app"][data-vertical] #boot-skeleton { padding: 0; }
        html[data-boot="app"][data-vertical] #boot-skeleton > .boot-row { display: none; }
        html[data-boot="app"][data-vertical] #boot-skeleton > :not(.boot-shell) { margin-left: 20px; margin-right: 20px; }
        html[data-vertical="taxi"] .boot-only-taxi { display: block; }
        html[data-vertical="food"] .boot-only-food { display: block; }
      }
      .boot-hdr { width: 100%; box-sizing: border-box; color: #fff; font-family: 'Outfit', 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      html[data-vertical="taxi"] .boot-hdr { background: #0B172A; height: 130px; }
      html[data-vertical="food"] .boot-hdr { background: #D91F3A; height: 393px; border-radius: 0 0 36px 36px; }
      .boot-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 8px; box-sizing: border-box; height: 62px; }
      .boot-loc { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
      .boot-pin { flex: none; fill: #5B9BD5; stroke: #5B9BD5; }
      html[data-vertical="food"] .boot-pin { fill: #FF6B7A; stroke: #FF6B7A; }
      .boot-loc-text { display: flex; flex-direction: column; min-width: 0; }
      .boot-loc-title { display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 700; line-height: 20px; min-width: 0; }
      .boot-loc-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .boot-loc-sub { font-size: 11px; font-weight: 500; line-height: 14px; opacity: .8; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 14px; }
      .boot-icons { display: flex; align-items: center; gap: 12px; flex: none; }
      .boot-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #fff; background: #FFF5E6; overflow: hidden; display: block; box-sizing: border-box; }
      .boot-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .boot-tabs { padding: 0 16px 12px; box-sizing: border-box; }
      .boot-tabs-in { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); box-sizing: border-box; }
      .boot-tab { flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 15px; font-weight: 700; color: rgba(255,255,255,.85); }
      html[data-vertical="taxi"] .boot-tab-taxi { background: #2563EB; color: #fff; }
      html[data-vertical="food"] .boot-tab-food { background: #FF5C72; color: #fff; }
      .boot-search { padding: 4px 16px 0; box-sizing: border-box; }
      .boot-search-pill { display: block; height: 46px; width: 76%; border-radius: 16px; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
      .boot-map { height: 200px; border-radius: 0 !important; margin-left: 0 !important; margin-right: 0 !important; background: rgba(203, 213, 225, .8); }
      html[data-theme="dark"] .boot-map { background: rgba(255,255,255,.08); }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-loader" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#CB202D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <p>Loading...</p>
    </div><div id="boot-skeleton" aria-hidden="true">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-hdr">
          <div class="boot-top">
            <div class="boot-loc">
              <svg class="boot-pin" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.5"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="none"/></svg>
              <div class="boot-loc-text">
                <div class="boot-loc-title"><span id="boot-loc-title"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:.9"><path d="m6 9 6 6 6-6"/></svg></div>
                <div class="boot-loc-sub" id="boot-loc-sub"></div>
              </div>
            </div>
            <div class="boot-icons">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
              <span class="boot-avatar"><img src="/assets/images/profile_avatar.webp" alt="" width="36" height="36" /></span>
            </div>
          </div>
          <div class="boot-tabs"><div class="boot-tabs-in"><span class="boot-tab boot-tab-taxi">Taxi</span><span class="boot-tab boot-tab-food">Food</span></div></div>
          <div class="boot-only-food boot-search"><span class="boot-search-pill"></span></div>
        </div>
        <div class="boot-only-taxi boot-map boot-bar"></div>
      </div>
      <div class="boot-row">
        <div class="boot-bar" style="width:160px;height:44px;border-radius:999px;"></div>
        <div class="boot-actions">
          <div class="boot-bar" style="width:96px;height:44px;border-radius:999px;"></div>
          <div class="boot-bar" style="width:44px;height:44px;border-radius:999px;"></div>
        </div>
      </div>
      <div class="boot-hero">
        <div class="boot-bar" style="height:192px;border-radius:22px;"></div>
      </div>
      <div class="boot-bar" style="height:28px;width:208px;border-radius:999px;margin-top:20px;"></div>
      <div class="boot-chip-row">
        <div class="boot-bar" style="height:36px;width:112px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:96px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:80px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:112px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:96px;border-radius:999px;"></div>
      </div>
    </div></div>
    <script>
      (function () {
        try {
          var l = window.__bootLoc;
          if (!l) return;
          var t = document.getElementById('boot-loc-title'), s = document.getElementById('boot-loc-sub');
          if (t) t.textContent = l.title;
          if (s) s.textContent = l.sub;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
