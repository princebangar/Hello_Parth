<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hello-parth-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hello Parth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Web fonts: ONE request for every family the screens use, loaded without blocking the first paint (the
         boot skeleton below must not wait on a third-party round trip; display=swap shows the text in a fallback
         font until the font arrives). The Taxi and Delivery stylesheets used to @import their own copy, which held
         their route chunk back until Google answered. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@500;600;700;800&family=Sora:wght@600;700&family=Caveat:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@500;600;700;800&family=Sora:wght@600;700&family=Caveat:wght@600;700&display=swap"></noscript>
    <script>
      (function() {
        try {
          // Only the Food/Taxi consumer app has a real dark mode toggle. Admin, login and the
          // driver/owner portals are light-only (no dark: styling anywhere in their markup) — this
          // must match isUserAppPath() in shared/utils/theme.js, or a saved consumer dark-mode
          // preference leaks into admin on a hard load/refresh, before React gets a chance to
          // correct it, leaving native form bits (text caret, hover I-beam cursor) rendered in
          // their dark-mode colour on an all-white admin page.
          var path = window.location.pathname || '';
          var isUserAppPath = path.indexOf('/food/') === 0 || path.indexOf('/taxi/user') === 0;
          var theme = 'light';
          if (isUserAppPath) {
            // 'userTheme' is the single current key (see shared/utils/theme.js);
            // the rest are only checked as a fallback for old saved values.
            var keys = ['userTheme', 'foodUserTheme', 'appTheme', 'userAppTheme'];
            for (var i = 0; i < keys.length; i++) {
              var v = localStorage.getItem(keys[i]);
              if (v) {
                theme = String(v).trim().toLowerCase() === 'dark' ? 'dark' : 'light';
                break;
              }
            }
          }
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;

          // Which placeholder to paint before the JS arrives: the home-shaped skeleton belongs to the consumer app
          // screens only (signed-in "/", Taxi and Food user); Terms / Privacy / Support get the plain loader (kept
          // in step with shared/utils/policyPaths.js); login, admin and the partner portals show nothing but the
          // page colour instead of a skeleton of a screen they will never show.
          var signedIn = !!(localStorage.getItem('userToken') || localStorage.getItem('user_accessToken'));
          var policy = /^\/(?:food\/user\/profile\/(?:terms|privacy|support-info|refund|shipping|cancellation)|food\/restaurant\/(?:terms|privacy|help-content|help-centre\/support)|food\/delivery\/(?:terms|privacy|profile\/terms|profile\/privacy|help\/content)|taxi\/(?:driver|owner)\/legal\/(?:terms|privacy|support)|taxi\/(?:terms|terms-and-conditions|privacy|privacy-policy|refund|cancellation))\/?$/.test(path);
          var partnerPortal = /^\/food\/(?:restaurant|delivery|admin)(?:\/|$)/.test(path);
          var consumerApp = (path === '/' && signedIn) || path.indexOf('/taxi/user') === 0 || (/^\/food(?:\/|$)/.test(path) && !partnerPortal);
          root.setAttribute('data-boot', policy ? 'policy' : consumerApp ? 'app' : 'plain');
        } catch(e) {}
      })();
    </script>
    <style>
      /* Match the app's own background before React mounts, so a hard
         reload shows a plain themed colour instead of a stark white flash. */
      html, body { background-color: #fffdf9; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0b0b0b; }

      /* Static placeholder — plain HTML/CSS shown the instant the document
         paints, before the JS bundle has even started parsing. Food and
         Taxi now both render the exact same AppShellSkeleton component
         (src/modules/Food/components/ui/loading-skeletons.jsx) once React
         mounts, so this copies just that component's top section (same
         gradient background, same header/hero/section shapes) — close
         enough that the hand-off from this static markup into the real,
         React-rendered one is invisible instead of a blank flash. Plain
         inline CSS, not Tailwind classes — in dev, Tailwind's CSS is
         injected by JS and isn't available yet at this point. React's
         createRoot(...).render() wipes #root's innerHTML the moment it
         mounts, so this needs no cleanup. */
      #boot-skeleton {
        min-height: 100vh;
        max-width: 1024px;
        margin: 0 auto;
        padding: 24px 20px;
        box-sizing: border-box;
        background: radial-gradient(circle at top left, #fff8ef, transparent 34%), linear-gradient(180deg, #fffdf9 0%, #fff8f1 100%);
      }
      html[data-theme="dark"] #boot-skeleton {
        background: linear-gradient(180deg, #0b0b0b 0%, #151515 100%);
      }
      .boot-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .boot-actions { display: flex; gap: 12px; }
      .boot-hero { border-radius: 28px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.7); padding: 16px; margin-top: 24px; box-sizing: border-box; }
      html[data-theme="dark"] .boot-hero { border-color: rgba(255,255,255,0.1); background: #141414; }
      .boot-chip-row { display: flex; gap: 12px; overflow: hidden; margin-top: 12px; }
      .boot-bar {
        background-color: rgba(226, 232, 240, 0.8);
        border-radius: 16px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      html[data-theme="dark"] .boot-bar { background-color: rgba(255, 255, 255, 0.1); }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      /* Only the consumer app screens get the skeleton; everything else stays on the plain page colour. */
      html[data-boot="plain"] #boot-skeleton,
      html[data-boot="policy"] #boot-skeleton { display: none; }

      /* Terms / Privacy / Support: the same loader the React screen shows (shared/components/PolicyPageLoader.jsx). */
      #boot-loader { display: none; }
      html[data-boot="policy"] #boot-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; background: #ffffff;
      }
      html[data-boot="policy"][data-theme="dark"] #boot-loader { background: #0a0a0a; }
      #boot-loader svg { animation: boot-spin 1s linear infinite; }
      #boot-loader p {
        margin: 16px 0 0; font: 700 10px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.1em; text-transform: uppercase; color: #6b7280;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-loader" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#CB202D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <p>Loading...</p>
    </div><div id="boot-skeleton" aria-hidden="true">
      <div class="boot-row">
        <div class="boot-bar" style="width:160px;height:44px;border-radius:999px;"></div>
        <div class="boot-actions">
          <div class="boot-bar" style="width:96px;height:44px;border-radius:999px;"></div>
          <div class="boot-bar" style="width:44px;height:44px;border-radius:999px;"></div>
        </div>
      </div>
      <div class="boot-hero">
        <div class="boot-bar" style="height:192px;border-radius:22px;"></div>
      </div>
      <div class="boot-bar" style="height:28px;width:208px;border-radius:999px;margin-top:20px;"></div>
      <div class="boot-chip-row">
        <div class="boot-bar" style="height:36px;width:112px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:96px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:80px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:112px;border-radius:999px;"></div>
        <div class="boot-bar" style="height:36px;width:96px;border-radius:999px;"></div>
      </div>
    </div></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
